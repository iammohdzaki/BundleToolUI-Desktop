name: kotlin_lint

on:
  pull_request:
    paths:
      - "**/*.kt"
      - ".github/workflows/kotlin_lint.yml"

jobs:
  ktlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: "17"

      - name: Run ktlint
        uses: vroy/gha-kotlin-linter@v4

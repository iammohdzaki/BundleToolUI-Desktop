name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            format: deb
            task: packageDistributionForCurrentOS
            ext: deb
          - os: macos-latest
            format: dmg
            task: packageDistributionForCurrentOS
            ext: dmg
          - os: windows-latest
            format: msi
            task: packageDistributionForCurrentOS
            ext: msi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Build App
        run: ./gradlew :composeApp:${{ matrix.task }} --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ matrix.os }}
          path: composeApp/build/compose/binaries/main/*/*.${{ matrix.ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
          generate_release_notes: true
